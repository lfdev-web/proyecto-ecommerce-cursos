# nginx de producción: sirve la SPA compilada y hace de proxy inverso hacia
# Django. Frontend y API quedan en el mismo origen, así que en producción no
# hace falta CORS ni el proxy de Vite.

upstream django {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # Tamaño máximo de subida: acompaña a DATA_UPLOAD_MAX_MEMORY_SIZE de Django
    # (5 MB). Sin esto nginx cortaría con 413 antes de que Django pueda
    # responder el mensaje de validación del avatar.
    client_max_body_size 5M;

    # --- Cabeceras de seguridad ---
    # Las que dependen de HTTPS (HSTS, redirección) las pone Django; estas son
    # las que conviene aplicar también a los archivos estáticos, que nunca
    # pasan por Django.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # --- API, admin y documentación → Django ---
    location ~ ^/(api|admin)/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Django lee la IP real del final de esta cadena (TRUSTED_PROXY_COUNT=1)
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Sin esta cabecera Django creería que la petición no es segura y
        # SECURE_SSL_REDIRECT entraría en un bucle de redirecciones.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # --- Archivos subidos por usuarios (avatares, cédulas) ---
    location /media/ {
        alias /app/media/;
        expires 7d;
        access_log off;
    }

    # --- Estáticos del Django Admin ---
    location /static/ {
        alias /app/static/;
        expires 30d;
        access_log off;
    }

    # --- Recursos compilados de la SPA ---
    # Vite les pone un hash en el nombre, así que se pueden cachear para siempre.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # --- La SPA ---
    # try_files con fallback a index.html: las rutas de React Router
    # (/mi-biblioteca, /perfil...) no existen como archivos, las resuelve el
    # router en el navegador. Sin esto, recargar en esas rutas daría 404.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}

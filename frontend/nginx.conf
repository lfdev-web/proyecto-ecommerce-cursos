# nginx de producción: sirve la SPA compilada y hace de proxy inverso hacia
# Django. Frontend y API quedan en el mismo origen, así que en producción no
# hace falta CORS ni el proxy de Vite.

upstream django {
    server backend:8000;
}

# Esquema real de la petición del CLIENTE.
#
# $scheme es el esquema con el que nginx recibe la petición, no con el que la
# hizo el navegador. Si hay otro proxy delante que termina el TLS (Caddy,
# Traefik, un balanceador), ese proxy habla con nginx por HTTP plano y
# $scheme vale "http": usarlo sobrescribiría el "https" que el proxy de
# adelante ya puso, Django creería que la conexión no es segura, dispararía
# SECURE_SSL_REDIRECT y se entraría en un BUCLE DE REDIRECCIONES que rompe
# todas las llamadas a la API (la SPA sigue cargando porque los archivos
# estáticos no pasan por Django, así que el síntoma es un catálogo vacío).
#
# Con este map se respeta la cabecera del proxy de adelante cuando existe, y
# se cae a $scheme solo si nginx recibe la petición directamente.
map $http_x_forwarded_proto $esquema_cliente {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# No anunciar la versión de nginx en la cabecera Server ni en las páginas de
# error. No frena a nadie que sepa lo que hace, pero evita que un escáner
# automático empareje "nginx/1.27.5" con una lista de vulnerabilidades y decida
# que vale la pena insistir.
server_tokens off;

server {
    listen 80;
    server_name _;

    # Tamaño máximo de subida: acompaña a DATA_UPLOAD_MAX_MEMORY_SIZE de Django
    # (5 MB). Sin esto nginx cortaría con 413 antes de que Django pueda
    # responder el mensaje de validación del avatar.
    client_max_body_size 5M;

    # --- Cabeceras de seguridad ---
    # Django ya las pone en SUS respuestas, pero el index.html y los archivos
    # compilados los sirve nginx directamente y nunca pasan por Django: sin
    # esto, la portada viajaba sin HSTS y sin CSP.
    #
    # CUIDADO al editar: en nginx, un add_header dentro de un `location`
    # DESCARTA todos los heredados del `server`. Por eso el bloque /assets/
    # repite los suyos en lugar de confiar en la herencia.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    # strict-origin-when-cross-origin y NO same-origin.
    #
    # Con "same-origin" el navegador no manda NINGÚN referente a otros
    # dominios, y el reproductor incrustado de YouTube lo necesita para
    # comprobar desde qué sitio se está incrustando: sin él responde
    # «Error 153» y NINGÚN video de las lecciones se reproduce. En desarrollo
    # no se notaba porque Vite no pone esta cabecera.
    #
    # Esta política sigue siendo discreta: a otros dominios les llega solo el
    # origen (https://lfldev.online), nunca la ruta ni los parámetros, así que
    # no se filtra qué curso o qué lección estaba viendo la persona.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Política de contenido: de dónde puede cargar cosas la página.
    # Limita el daño de un XSS — aunque alguien lograra inyectar un <script>,
    # el navegador no ejecutaría código de otro dominio ni podría enviar los
    # datos robados fuera de este origen.
    #
    # Cada permiso está por una razón concreta:
    #   style-src 'unsafe-inline' -> React escribe estilos con style={{...}}
    #   fonts.googleapis / gstatic -> la tipografía del sitio (ver index.html)
    #   frame-src youtube          -> los videos de las lecciones
    #   img-src https:             -> portadas y avatares
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; frame-src https://www.youtube.com https://www.youtube-nocookie.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # --- API, admin y documentación → Django ---
    location ~ ^/(api|admin)/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Django lee la IP real contando desde el final de esta cadena. Con Caddy
        # delante son DOS saltos (Caddy + nginx): TRUSTED_PROXY_COUNT=2.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Esquema real del cliente (ver el map de arriba): NO usar $scheme,
        # que sería el del salto Caddy→nginx y provocaría un bucle de
        # redirecciones con SECURE_SSL_REDIRECT.
        proxy_set_header X-Forwarded-Proto $esquema_cliente;
        proxy_redirect off;
    }

    # --- Archivos subidos por usuarios (avatares, cédulas) ---
    location /media/ {
        alias /app/media/;
        expires 7d;
        access_log off;
    }

    # --- Estáticos del Django Admin ---
    location /static/ {
        alias /app/static/;
        expires 30d;
        access_log off;
    }

    # --- Recursos compilados de la SPA ---
    # Vite les pone un hash en el nombre, así que se pueden cachear para siempre.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        # Este add_header descarta los del bloque server (ver la nota de
        # arriba), así que las cabeceras que importan aquí se repiten.
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        access_log off;
    }

    # --- La SPA ---
    # try_files con fallback a index.html: las rutas de React Router
    # (/mi-biblioteca, /perfil...) no existen como archivos, las resuelve el
    # router en el navegador. Sin esto, recargar en esas rutas daría 404.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
